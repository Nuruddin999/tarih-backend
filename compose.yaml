services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarih
      POSTGRES_PASSWORD: tarih_local
      POSTGRES_DB: tarih
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarih -d tarih"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
