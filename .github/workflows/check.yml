name: Check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tarih:tarih_local@localhost:5432/tarih
      TEST_DATABASE_URL: postgresql://tarih:tarih_local@localhost:5432/tarih
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tarih
          POSTGRES_PASSWORD: tarih_local
          POSTGRES_DB: tarih
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/people.unit.cjs
      - run: npm run test:integration

